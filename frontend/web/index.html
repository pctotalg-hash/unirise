<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNIRISE — Campus Social & Community Platform</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0C0E14">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ==================== THEME STYLES ==================== */
    body {
      background-color: #0C0E14;
      color: #FFFFFF;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    
    #app-frame {
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    header, nav, main {
      transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
    }

    /* Light Mode Overrides */
    body.light-mode {
      background-color: #CBD5E1;
      color: #0F172A;
    }

    body.light-mode #app-frame {
      background-color: #F8FAFC !important;
      border-color: #CBD5E1 !important;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }

    body.light-mode header {
      background-color: #FFFFFF !important;
      border-color: #E2E8F0 !important;
    }

    body.light-mode nav {
      background-color: #FFFFFF !important;
      border-color: #E2E8F0 !important;
    }

    body.light-mode nav button span {
      color: #64748B;
    }

    body.light-mode .card-bg,
    body.light-mode .bg-\[\#1C2030\],
    body.light-mode .bg-\[\#141722\],
    body.light-mode .bg-\[\#0C0E14\],
    body.light-mode .bg-\[\#1F2436\],
    body.light-mode .bg-\[\#181818\],
    body.light-mode .bg-\[\#181818\]\/80,
    body.light-mode .bg-\[\#0F0F0F\] {
      background-color: #FFFFFF !important;
      border-color: #E2E8F0 !important;
      color: #0F172A;
    }

    body.light-mode .border-\[\#2B3148\],
    body.light-mode .border-\[\#1F2436\],
    body.light-mode .border-\[\#202020\] {
      border-color: #E2E8F0 !important;
    }

    body.light-mode .text-white {
      color: #0F172A !important;
    }

    body.light-mode .text-gray-200,
    body.light-mode .text-gray-300,
    body.light-mode .text-gray-400 {
      color: #475569 !important;
    }

    body.light-mode .text-gray-500 {
      color: #64748B !important;
    }

    body.light-mode input,
    body.light-mode textarea,
    body.light-mode select {
      background-color: #F1F5F9 !important;
      border-color: #CBD5E1 !important;
      color: #0F172A !important;
    }

    body.light-mode input::placeholder,
    body.light-mode textarea::placeholder {
      color: #94A3B8 !important;
    }

    body.light-mode .fixed.inset-0.bg-black\/80,
    body.light-mode .fixed.inset-0.bg-black\/70 {
      background-color: rgba(15, 23, 42, 0.6) !important;
    }

    body.light-mode .text-gradient {
      background: linear-gradient(135deg, #00B4D8 0%, #7B2CBF 100%) !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
    }

    body.light-mode .bg-[#2563EB] {
      background: linear-gradient(135deg, #00E5FF 0%, #9D4EDD 100%) !important;
    }

    body.light-mode #theme-toggle-btn {
      color: #475569;
    }
    body.light-mode #theme-toggle-btn:hover {
      color: #0F172A;
    }

    body.light-mode #nav-notifications-btn {
      color: #475569;
    }
    body.light-mode #nav-notifications-btn:hover {
      color: #0F172A;
    }
  </style>
</head>
<body class="flex justify-center bg-black min-h-screen">

  <!-- Mobile App Frame Container -->
  <div id="app-frame" class="relative w-full max-w-md h-[920px] bg-[#0F0F0F] shadow-2xl overflow-hidden flex flex-col border border-[#202020] rounded-[40px] my-auto">
    
    <!-- Top Header -->
    <header class="flex items-center justify-between px-5 py-4 bg-[#181818] border-b border-[#202020] z-10">
      <div class="flex items-center gap-2 cursor-pointer" onclick="if(currentUser) switchTab(currentUser.role === 'admin' ? 'admin' : 'feed')">
        <div class="w-8 h-8 rounded-xl overflow-hidden flex items-center justify-center bg-[#0C0E14] border border-[#202020]">
          <img src="logo.png" alt="UNIRISE" class="w-full h-full object-cover">
        </div>
        <span class="text-xl font-bold tracking-tight text-white font-mono">UNIRISE</span>
      </div>
      <div class="flex items-center gap-3">
        <button id="theme-toggle-btn" onclick="toggleTheme()" class="text-gray-400 hover:text-white transition-transform duration-300 hover:scale-110 p-1 flex items-center justify-center" title="Turn off dark mode">
          <i id="theme-toggle-icon" class="fa-solid fa-moon text-xl text-yellow-400"></i>
        </button>
        <button id="nav-notifications-btn" onclick="switchTab('notifications')" class="relative text-gray-400 hover:text-white" title="Notifications">
          <i class="fa-regular fa-bell text-xl"></i>
          <span id="unread-count-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold hidden">0</span>
        </button>
      </div>
    </header>

    <!-- Main View Dynamic Area -->
    <main id="app-view" class="flex-1 overflow-y-auto p-4 relative pb-20">
      <!-- Screens rendered via JS -->
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="absolute bottom-0 inset-x-0 h-16 bg-[#181818] border-t border-[#202020] flex items-center justify-around z-20 px-2">
      <button id="nav-home" onclick="switchTab(currentUser && currentUser.role === 'admin' ? 'admin' : 'feed')" class="flex flex-col items-center text-[#2563EB] gap-1">
        <i id="icon-home" class="fa-solid fa-newspaper text-lg"></i>
        <span id="label-home" class="text-[10px] font-bold">Feed</span>
      </button>
      <button id="nav-chat" onclick="switchTab('chat')" class="relative flex flex-col items-center text-gray-400 hover:text-white gap-1">
        <i class="fa-solid fa-comments text-lg"></i>
        <span class="text-[10px]">Chats</span>
        <span id="chat-unread-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold hidden">3</span>
      </button>
      <button id="nav-search" onclick="switchTab('search')" class="flex flex-col items-center gap-1">
        <div class="w-10 h-10 rounded-full bg-[#2563EB] text-white font-bold flex items-center justify-center shadow-lg -mt-4 border-2 border-[#0C0E14]">
          <i class="fa-solid fa-magnifying-glass text-sm"></i>
        </div>
        <span class="text-[10px] text-gray-400">Search</span>
      </button>
      <button id="nav-clubs" onclick="switchTab('clubs')" class="flex flex-col items-center text-gray-400 hover:text-white gap-1">
        <i class="fa-solid fa-trophy text-lg"></i>
        <span class="text-[10px]">Clubs</span>
      </button>
      <button id="nav-profile" onclick="activeProfileUserId=null; switchTab('profile')" class="flex flex-col items-center text-gray-400 hover:text-white gap-1">
        <i class="fa-solid fa-user text-lg"></i>
        <span class="text-[10px]">Me</span>
      </button>
    </nav>

    <!-- Radial Category Menu Overlay -->
    <div id="radial-menu" class="radial-overlay" onclick="hideRadialMenu()">
      <div id="radial-center" class="radial-circle"></div>
      <div id="radial-items" class="absolute inset-0"></div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:5000/api';
    let currentUser = null;
    let token = localStorage.getItem('unirise_token');
    let selectedRole = 'admin';

    // Theme Toggle System
    function applyTheme(themeName) {
      const btn = document.getElementById('theme-toggle-btn');
      const icon = document.getElementById('theme-toggle-icon');
      
      if (themeName === 'light') {
        document.body.classList.add('light-mode');
        if (btn) btn.setAttribute('title', 'Turn on dark mode');
        if (icon) icon.className = 'fa-solid fa-sun text-xl text-amber-500';
        localStorage.setItem('unirise_theme', 'light');
      } else {
        document.body.classList.remove('light-mode');
        if (btn) btn.setAttribute('title', 'Turn off dark mode');
        if (icon) icon.className = 'fa-solid fa-moon text-xl text-yellow-400';
        localStorage.setItem('unirise_theme', 'dark');
      }
    }

    function toggleTheme() {
      const currentTheme = localStorage.getItem('unirise_theme') || 'dark';
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      applyTheme(newTheme);
    }

    // Apply saved theme immediately
    applyTheme(localStorage.getItem('unirise_theme') || 'dark');
    let activeCategoryFilter = null;
    let activeSearchCategory = 'ALL';
    let searchDebounceTimer = null;
    let recentSearches = JSON.parse(localStorage.getItem('unirise_recent_searches') || '["hackathon", "coding club", "AI internship", "Rahul"]');

    // 1.112 Second Long Press Tracking Variables
    let longPressTimer = null;
    let touchStartPos = null;
    const LONG_PRESS_DURATION = 1112;
    const MOVE_THRESHOLD = 12;

    let publicColleges = [];
    let selectedCollegeObj = null;
    let studentAuthMode = 'login'; // 'login' or 'signup'

    async function loadPublicColleges(search = '') {
      try {
        const res = await fetch(`${API_BASE}/colleges?search=${encodeURIComponent(search)}`);
        if (res.ok) {
          publicColleges = await res.json();
          if (!selectedCollegeObj && publicColleges.length > 0) {
            selectedCollegeObj = publicColleges[0];
          }
        }
      } catch (e) {
        console.error('Error loading colleges:', e);
      }
    }

    function selectCollege(collegeId) {
      selectedCollegeObj = publicColleges.find(c => (c._id === collegeId || c.id === collegeId)) || null;
      renderLoginView();
    }

    function toggleStudentAuthMode(mode) {
      studentAuthMode = mode;
      renderLoginView();
    }

    async function executeLogin() {
      const emailInput = document.getElementById('email-input');
      const passInput = document.getElementById('pass-input');

      const email = emailInput ? emailInput.value.trim() : 'student@unirise.demo';
      const password = passInput ? passInput.value.trim() : 'Student@123';

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        
        if (res.ok && data.token) {
          token = data.token;
          localStorage.setItem('unirise_token', token);
          currentUser = data.user || data;
          
          const userRole = (currentUser.role || '').toLowerCase();
          if (userRole === 'admin' || userRole === 'college_admin' || userRole === 'platform_admin') {
            switchTab('admin');
          } else {
            switchTab('feed');
          }
        } else {
          alert(data.message || 'Invalid email or password');
        }
      } catch (err) {
        alert('Unable to connect to backend server at ' + API_BASE);
      }
    }

    async function executeStudentSignup() {
      const name = document.getElementById('signup-name-input')?.value.trim();
      const email = document.getElementById('signup-email-input')?.value.trim();
      const password = document.getElementById('signup-pass-input')?.value.trim();
      const department = document.getElementById('signup-dept-input')?.value.trim();
      const year = document.getElementById('signup-year-input')?.value.trim();

      if (!name || !email || !password) {
        alert('Please provide your name, email, and password.');
        return;
      }

      if (!selectedCollegeObj) {
        alert('Please select your registered college first.');
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name,
            email,
            password,
            collegeId: selectedCollegeObj._id || selectedCollegeObj.id,
            department: department || 'Computer Engineering',
            year: year || '1st Year'
          })
        });

        const data = await res.json();
        if (res.ok && data.token) {
          token = data.token;
          localStorage.setItem('unirise_token', token);
          currentUser = data.user || data;
          switchTab('feed');
        } else {
          alert(data.message || 'Student registration failed.');
        }
      } catch (err) {
        alert('Error connecting to UNIRISE API: ' + err.message);
      }
    }

    function openCollegeRegistrationModal() {
      const modal = document.createElement('div');
      modal.id = 'college-reg-modal';
      modal.className = 'fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50';
      modal.innerHTML = `
        <div class="card-bg p-5 rounded-2xl w-full max-w-sm border border-[#202020] shadow-2xl relative">
          <div class="flex items-center justify-between mb-3 border-b border-[#202020] pb-2">
            <h3 class="font-black text-amber-400 text-sm flex items-center gap-2">
              <i class="fa-solid fa-building-columns"></i> Register College Listing
            </h3>
            <button onclick="document.getElementById('college-reg-modal').remove()" class="text-gray-400 hover:text-white text-lg">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
          
          <p class="text-[11px] text-gray-400 mb-4">Submit your official college registration. Accounts enter <span class="text-amber-400 font-bold">pending verification</span> state until approved by platform admin.</p>

          <div class="space-y-2.5 text-xs">
            <div>
              <label class="text-[10px] font-bold text-gray-400 block mb-1">College Full Name</label>
              <input type="text" id="reg-col-name" placeholder="e.g. State Institute of Technology" class="w-full bg-[#181818] border border-[#202020] rounded-xl p-2.5 text-white outline-none focus:border-amber-400">
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="text-[10px] font-bold text-gray-400 block mb-1">Acronym / Code</label>
                <input type="text" id="reg-col-short" placeholder="e.g. SIT" class="w-full bg-[#181818] border border-[#202020] rounded-xl p-2.5 text-white outline-none focus:border-amber-400">
              </div>
              <div>
                <label class="text-[10px] font-bold text-gray-400 block mb-1">Location</label>
                <input type="text" id="reg-col-loc" placeholder="e.g. Mumbai, MH" class="w-full bg-[#181818] border border-[#202020] rounded-xl p-2.5 text-white outline-none focus:border-amber-400">
              </div>
            </div>
            <div>
              <label class="text-[10px] font-bold text-gray-400 block mb-1">Official College Email</label>
              <input type="email" id="reg-col-email" placeholder="e.g. admin@sit.edu.in" class="w-full bg-[#181818] border border-[#202020] rounded-xl p-2.5 text-white outline-none focus:border-amber-400">
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="text-[10px] font-bold text-gray-400 block mb-1">Admin Name</label>
                <input type="text" id="reg-col-admin" placeholder="e.g. Dr. R. Verma" class="w-full bg-[#181818] border border-[#202020] rounded-xl p-2.5 text-white outline-none focus:border-amber-400">
              </div>
              <div>
                <label class="text-[10px] font-bold text-gray-400 block mb-1">Admin Password</label>
                <input type="password" id="reg-col-pass" placeholder="••••••••" class="w-full bg-[#181818] border border-[#202020] rounded-xl p-2.5 text-white outline-none focus:border-amber-400">
              </div>
            </div>
            
            <button onclick="submitCollegeRegistration()" class="w-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold py-3 rounded-xl uppercase tracking-wider text-xs mt-3 shadow-lg">
              Submit Application
            </button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    }

    async function submitCollegeRegistration() {
      const name = document.getElementById('reg-col-name')?.value.trim();
      const shortName = document.getElementById('reg-col-short')?.value.trim();
      const location = document.getElementById('reg-col-loc')?.value.trim();
      const email = document.getElementById('reg-col-email')?.value.trim();
      const adminName = document.getElementById('reg-col-admin')?.value.trim();
      const adminPassword = document.getElementById('reg-col-pass')?.value.trim();

      if (!name || !shortName || !email || !adminPassword) {
        alert('Please fill out all required fields.');
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/colleges/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, shortName, location, email, adminName, adminPassword })
        });
        const data = await res.json();
        if (res.ok) {
          alert('✓ College registration submitted successfully!\nStatus: Pending Verification.\nOnce platform administrators review your application, your credentials will be activated.');
          document.getElementById('college-reg-modal')?.remove();
        } else {
          alert(data.message || 'College registration failed.');
        }
      } catch (err) {
        alert('Error submitting college registration: ' + err.message);
      }
    }

    function updateNavHighlight(activeTab) {
      ['home', 'chat', 'search', 'clubs', 'profile'].forEach(tab => {
        const btn = document.getElementById(`nav-${tab}`);
        if (!btn) return;
        const isActive = (tab === 'home' && (activeTab === 'feed' || activeTab === 'admin' || activeTab === 'post_detail')) ||
                         (tab === 'clubs' && activeTab === 'club_detail') ||
                         tab === activeTab;

        if (isActive) {
          btn.className = tab === 'chat'
            ? "relative flex flex-col items-center text-[#2563EB] gap-1 font-bold"
            : "flex flex-col items-center text-[#2563EB] gap-1 font-bold";
        } else {
          btn.className = tab === 'chat'
            ? "relative flex flex-col items-center text-gray-400 hover:text-white gap-1"
            : "flex flex-col items-center text-gray-400 hover:text-white gap-1";
        }
      });
      
      const homeLabel = document.getElementById('label-home');
      const homeIcon = document.getElementById('icon-home');
      if (homeLabel && homeIcon && currentUser) {
        if (currentUser.role === 'admin' || currentUser.role === 'college_admin' || currentUser.role === 'platform_admin') {
          homeLabel.innerText = 'College';
          homeIcon.className = 'fa-solid fa-building-columns text-lg';
        } else {
          homeLabel.innerText = 'Feed';
          homeIcon.className = 'fa-solid fa-newspaper text-lg';
        }
      }
    }

    let activeTab = 'feed';
    let navStack = [];
    let currentViewState = { type: 'tab', tab: 'feed' };

    function getCurrentViewState() {
      return JSON.parse(JSON.stringify(currentViewState));
    }

    function pushNavState(newState) {
      const currentStr = JSON.stringify(currentViewState);
      const newStr = JSON.stringify(newState);
      if (currentStr !== newStr) {
        navStack.push(getCurrentViewState());
      }
      currentViewState = newState;
    }

    function goBack() {
      if (navStack.length === 0) {
        switchTab('feed', true);
        return;
      }
      const prevState = navStack.pop();
      restoreNavState(prevState);
    }

    function restoreNavState(state) {
      if (!state) {
        switchTab('feed', true);
        return;
      }
      currentViewState = state;
      console.log(`[Navigation] Restoring state: ${state.type} (${state.tab || ''})`);

      if (state.type === 'tab') {
        if (state.tab === 'profile') activeProfileUserId = null;
        switchTab(state.tab, true);
      } else if (state.type === 'post_detail') {
        renderPostDetailView(state.postId, true);
      } else if (state.type === 'club_detail') {
        renderClubDetailView(state.clubId, true);
      } else if (state.type === 'club_members') {
        renderClubMembersView(state.clubId, true);
      } else if (state.type === 'profile') {
        viewUserProfile(state.userId, true);
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const photoModal = document.getElementById('photo-viewer-modal');
        if (photoModal) { photoModal.remove(); return; }
        const editModal = document.getElementById('profile-modal-overlay');
        if (editModal) { editModal.remove(); return; }
        const postModal = document.getElementById('create-post-modal');
        if (postModal) { postModal.remove(); return; }
        if (navStack.length > 0) {
          goBack();
        }
      }
    });

    async function switchTab(tab, isBack = false) {
      if (!isBack && activeTab !== tab) {
        pushNavState({ type: 'tab', tab: tab });
      } else {
        currentViewState = { type: 'tab', tab: tab };
      }

      activeTab = tab;
      updateNavHighlight(tab);
      const main = document.getElementById('app-view');
      if (!token && tab !== 'login') {
        renderLoginView();
        return;
      }

      if (tab === 'admin') renderCollegeDashboardView();
      else if (tab === 'feed') renderFeedView();
      else if (tab === 'clubs') renderClubsView();
      else if (tab === 'search') renderSearchView();
      else if (tab === 'chat') {
        if (!activePersonalChatUser && !activeGroupChatId && activeChatSubTab !== 'personal' && activeChatSubTab !== 'groups') {
          activeChatSubTab = 'community';
        }
        renderChatView();
      }
      else if (tab === 'profile') renderProfileView();
      else if (tab === 'notifications') renderNotificationView();
    }

    async function renderLoginView() {
      if (publicColleges.length === 0) {
        await loadPublicColleges();
      }

      const activeCollege = selectedCollegeObj || (publicColleges.length > 0 ? publicColleges[0] : null);

      document.getElementById('app-view').innerHTML = `
        <div class="flex flex-col items-center justify-center min-h-full py-4 px-2 text-center max-w-sm mx-auto">
          <!-- App Header -->
          <div class="w-12 h-12 rounded-xl overflow-hidden flex items-center justify-center bg-[#0C0E14] border border-[#202020] mb-2 shadow-sm">
            <img src="logo.png" alt="UNIRISE" class="w-full h-full object-cover">
          </div>
          <h1 class="text-lg font-bold text-white tracking-wide mb-0.5">UNIRISE</h1>
          <p class="text-gray-400 text-xs font-normal mb-4">Campus Community Platform</p>

          <!-- 1. College Selection Card -->
          <div class="card-bg p-4 rounded-xl w-full text-left border border-[#202020] shadow-md mb-3">
            <div class="flex items-center justify-between mb-2.5">
              <span class="text-xs font-semibold text-gray-200 uppercase tracking-wider flex items-center gap-1.5">
                <i class="fa-solid fa-building-columns text-[#2563EB]"></i> 1. Select Your College
              </span>
              ${activeCollege ? `<span class="text-[10px] font-medium text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded-md">VERIFIED DIRECTORY</span>` : ''}
            </div>

            <!-- Professional Search Field -->
            <div class="relative mb-2.5">
              <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-xs"></i>
              <input type="text" placeholder="Search registered colleges..." oninput="loadPublicColleges(this.value).then(() => renderLoginView())" class="w-full bg-[#181818] border border-[#202020] text-xs rounded-lg pl-9 pr-3 py-2 text-white placeholder-gray-500 outline-none focus:border-[#2563EB] transition-all">

    // 1.112 SECOND LONG-PRESS GESTURE HANDLERS
    function startLongPressTimer(e) {
      cancelLongPressTimer();

      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      touchStartPos = { x: clientX, y: clientY };

      longPressTimer = setTimeout(() => {
        showRadialMenuAt(touchStartPos.x, touchStartPos.y);
      }, LONG_PRESS_DURATION);
    }

    function checkMoveCancel(e) {
      if (!touchStartPos || !longPressTimer) return;

      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const dist = Math.hypot(clientX - touchStartPos.x, clientY - touchStartPos.y);
      if (dist > MOVE_THRESHOLD) {
        cancelLongPressTimer();
      }
    }

    function cancelLongPressTimer() {
      if (longPressTimer) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
      touchStartPos = null;
    }

    function showRadialMenuAt(x, y) {
      const menu = document.getElementById('radial-menu');
      const center = document.getElementById('radial-center');
      const items = document.getElementById('radial-items');
      
      const appFrame = document.querySelector('.max-w-md').getBoundingClientRect();
      let relX = x - appFrame.left;
      let relY = y - appFrame.top;

      relX = Math.max(40, Math.min(appFrame.width - 40, relX));
      relY = Math.max(60, Math.min(appFrame.height - 80, relY));

      center.style.left = `${relX}px`;
      center.style.top = `${relY}px`;

      const categories = [
        { label: 'Events', icon: 'fa-calendar-days', color: '#00E5FF', name: 'Events' },
        { label: 'Hackathons', icon: 'fa-code', color: '#9D4EDD', name: 'Hackathons' },
        { label: 'Internships', icon: 'fa-briefcase', color: '#00E5FF', name: 'Internships' },
        { label: 'Clubs', icon: 'fa-trophy', color: '#F59E0B', name: 'Clubs' },
        { label: 'Student Posts', icon: 'fa-graduation-cap', color: '#EC4899', name: 'Student Posts' },
        { label: 'Announcements', icon: 'fa-bullhorn', color: '#F97316', name: 'Announcements' },
        { label: 'Opportunities', icon: 'fa-rocket', color: '#10B981', name: 'Opportunities' },
        { label: 'Mixed Feed', icon: 'fa-newspaper', color: '#FFFFFF', name: 'Mixed Feed' }
      ];

      items.innerHTML = categories.map((cat, idx) => {
        const angle = (idx * (2 * Math.PI / categories.length)) - (Math.PI / 2);
        const radius = 115;
        let ix = relX + radius * Math.cos(angle) - 25;
        let iy = relY + radius * Math.sin(angle) - 25;

        ix = Math.max(15, Math.min(appFrame.width - 65, ix));
        iy = Math.max(45, Math.min(appFrame.height - 75, iy));

        return `
          <div style="left: ${ix}px; top: ${iy}px" onclick="selectRadialCategory('${cat.name}')" class="absolute flex flex-col items-center gap-1 cursor-pointer transition-transform hover:scale-110">
            <div class="w-12 h-12 rounded-full bg-[#1C2030] border-2 flex items-center justify-center shadow-lg" style="border-color: ${cat.color}; color: ${cat.color}">
              <i class="fa-solid ${cat.icon} text-lg"></i>
            </div>
            <span class="text-[9px] font-extrabold text-white bg-black/90 px-2 py-0.5 rounded-md border border-[#202020] shadow-md">${cat.label}</span>
          </div>
        `;
      }).join('');

      menu.style.display = 'block';
    }

    function selectRadialCategory(catName) {
      hideRadialMenu();
      activeCategoryFilter = catName === 'Mixed Feed' ? null : catName;

    async function renderClubMembersView(clubId, isBack = false) {
      if (!isBack) {
        pushNavState({ type: 'club_members', tab: 'clubs', clubId: clubId });
      } else {
        currentViewState = { type: 'club_members', tab: 'clubs', clubId: clubId };

      try {
        const [clubRes, membersRes] = await Promise.all([
          fetch(`${API_BASE}/clubs/${clubId}`, { headers: { 'Authorization': `Bearer ${token}` } }),
          fetch(`${API_BASE}/clubs/${clubId}/members`, { headers: { 'Authorization': `Bearer ${token}` } })
        ]);

        const members = await membersRes.json();
        window.currentClubMembersList = Array.isArray(members) ? members : [];

        renderMembersListUI(club, window.currentClubMembersList);
      } catch (err) {
        main.innerHTML = `<div class="text-red-400 text-center py-10">Error loading club members: ${err.message}</div>`;
      }

    function renderMembersListUI(club, members) {
      const main = document.getElementById('app-view');
      main.innerHTML = `
        <div class="flex items-center justify-between mb-4 pb-2 border-b border-[#202020]">
          <button onclick="goBack()" class="flex items-center gap-2 text-xs font-bold text-[#2563EB] hover:text-white">

          </button>
          <span class="text-[10px] font-extrabold text-[#2563EB] bg-[#2563EB]/10 border border-[#2563EB]/30 px-3 py-1 rounded-full uppercase">
            ${members.length} Members
          </span>
        </div>

        <div class="card-bg rounded-2xl p-4 border border-[#202020] shadow-xl mb-4">
          <div class="flex items-center gap-3 mb-3">
            <img src="${club.logo || 'https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=500'}" class="w-10 h-10 rounded-full border border-[#202020] object-cover">
            <div>
              <h2 class="text-base font-black text-white">${club.name} Members Directory</h2>
              <p class="text-xs text-gray-400">Verified campus club members</p>
            </div>
          </div>

          <div class="relative mb-3">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-500 text-xs"></i>
            <input type="text" id="club-member-search" placeholder="Search members by name, department, or year..." oninput="filterClubMembersUI(this.value)" class="w-full bg-[#181818] border border-[#202020] text-xs rounded-xl pl-9 pr-3 py-2 text-white outline-none focus:border-[#2563EB]">
          </div>

          <div id="club-members-container" class="space-y-2">
            ${renderMemberCardsHTML(members)}
          </div>
        </div>
      `;
    }

    function renderMemberCardsHTML(members) {
      if (!members || members.length === 0) {
        return `<div class="text-xs text-gray-400 text-center py-6">No members found matching your search.</div>`;
      }
      return members.map(m => {
        const mId = m._id || m.id;
        return `
          <div onclick="openUserProfileFromClub('${mId}')" class="bg-[#181818] p-3 rounded-xl border border-[#202020] hover:border-[#2563EB]/50 transition-all cursor-pointer flex items-center justify-between">
            <div class="flex items-center gap-3 min-w-0">
              <img src="${m.profilePhoto || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500'}" class="w-10 h-10 rounded-full object-cover border border-[#202020]">
              <div class="min-w-0">
                <div class="flex items-center gap-1.5">
                  <span class="text-xs font-bold text-white truncate">${m.name}</span>
                  ${m.isVerified ? '<i class="fa-solid fa-circle-check text-[#1D9BF0] text-[10px]"></i>' : ''}
                </div>
                <p class="text-[10px] text-gray-400 truncate">
                  ${m.department || 'Student'} ${m.year ? '• ' + m.year : ''}
                </p>
              </div>
            </div>
            <button onclick="event.stopPropagation(); openDirectChatFromProfile('${mId}', '${m.name}')" class="bg-[#2563EB]/10 text-[#2563EB] hover:bg-[#2563EB] hover:text-white border border-[#2563EB]/30 px-3 py-1.5 rounded-lg text-[10px] font-bold transition-all flex items-center gap-1">
              <i class="fa-solid fa-paper-plane"></i> Message
            </button>
          </div>
        `;
      }).join('');
    }

    function filterClubMembersUI(query) {
      const q = (query || '').toLowerCase().trim();
      const filtered = (window.currentClubMembersList || []).filter(m => {
        const name = (m.name || '').toLowerCase();
        const dept = (m.department || '').toLowerCase();
        const year = (m.year || '').toLowerCase();
        return name.includes(q) || dept.includes(q) || year.includes(q);
      });
      const container = document.getElementById('club-members-container');
      if (container) {
        container.innerHTML = renderMemberCardsHTML(filtered);
      }
    }

          <input type="text" id="global-search-input" oninput="onSearchInputChanged(this.value)" placeholder="Search students, clubs, posts, events..." class="w-full bg-[#181818] border border-[#202020] text-white text-xs rounded-xl pl-10 pr-10 py-3 focus:border-[#2563EB] outline-none shadow-md">

    function renderDefaultSearchState() {

            <div class="flex flex-wrap gap-2">

            <button onclick="triggerQuickSearch('coding club')" class="bg-[#2563EB]/10 border border-[#2563EB]/40 text-[#2563EB] text-xs font-bold px-3 py-1.5 rounded-xl">🏆 Coding Club</button>
            <button onclick="triggerQuickSearch('AI internship')" class="bg-amber-500/10 border border-amber-500/40 text-amber-400 text-xs font-bold px-3 py-1.5 rounded-xl">💼 Internships</button>

    function triggerQuickSearch(query) {
      const input = document.getElementById('global-search-input');
      if (input) {
        input.value = query;
        onSearchInputChanged(query);
      }
    }

    function setSearchCategory(cat) {
      activeSearchCategory = cat;
      const input = document.getElementById('global-search-input');
      const q = input ? input.value.trim() : '';

      // Update Pill Highlights
      ['ALL', 'PEOPLE', 'POSTS', 'CLUBS', 'EVENTS', 'HACKATHONS', 'INTERNSHIPS', 'GROUPS', 'OPPORTUNITIES'].forEach(c => {
        const btn = document.getElementById(`filter-btn-${c}`);
        if (btn) {
          if (c === activeSearchCategory) {
            btn.className = "bg-[#2563EB] text-white font-bold shadow-sm text-[10px] px-3 py-1.5 rounded-xl whitespace-nowrap transition-all";
          } else {
            btn.className = "bg-[#1C2030] text-gray-300 border border-[#202020] font-semibold text-[10px] px-3 py-1.5 rounded-xl whitespace-nowrap transition-all";
          }
        }
      });

      if (q) performGlobalSearch(q);
    }

    function onSearchInputChanged(val) {
      const clearBtn = document.getElementById('clear-search-btn');
      if (clearBtn) {
        if (val.trim()) clearBtn.classList.remove('hidden');
        else clearBtn.classList.add('hidden');
      }

      if (searchDebounceTimer) clearTimeout(searchDebounceTimer);

      if (!val.trim()) {
        document.getElementById('search-dynamic-content').innerHTML = renderDefaultSearchState();
        return;
      }

      document.getElementById('search-dynamic-content').innerHTML = `
        <div class="text-center py-10 text-gray-400">
          <i class="fa-solid fa-circle-notch fa-spin text-2xl text-[#2563EB] mb-2"></i>
          <p class="text-xs">Searching UNIRISE database & AI Agent...</p>
        </div>
      `;

      searchDebounceTimer = setTimeout(() => {
        performGlobalSearch(val.trim());
      }, 300);
    }

    function clearSearchInput() {
      const input = document.getElementById('global-search-input');
      if (input) {
        input.value = '';
        onSearchInputChanged('');
      }
    }

    function clearRecentSearches() {
      recentSearches = [];
      localStorage.removeItem('unirise_recent_searches');
      document.getElementById('search-dynamic-content').innerHTML = renderDefaultSearchState();
    }

    async function performGlobalSearch(query) {
      if (!query || !query.trim()) {
        document.getElementById('search-dynamic-content').innerHTML = renderDefaultSearchState();
        return;
      }

      const qTrimmed = query.trim();
      if (!recentSearches.includes(qTrimmed)) {
        recentSearches.unshift(qTrimmed);
        if (recentSearches.length > 5) recentSearches.pop();
        localStorage.setItem('unirise_recent_searches', JSON.stringify(recentSearches));
      }

      try {
        console.log(`[SEARCH API REQUEST] Query: "${qTrimmed}" | Category: "${activeSearchCategory}"`);
        const searchRes = await fetch(`${API_BASE}/search?q=${encodeURIComponent(qTrimmed)}&category=${encodeURIComponent(activeSearchCategory)}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!searchRes.ok) {
          console.error(`[SEARCH API ERROR] HTTP Status ${searchRes.status}`);
          showSearchErrorUI('Search is temporarily unavailable.', qTrimmed);
          return;
        }

        const searchData = await searchRes.json();
        console.log('[SEARCH API RESPONSE]', searchData);

        let aiData = { suggestions: [] };
        try {
          const aiRes = await fetch(`${API_BASE}/search/ai?q=${encodeURIComponent(qTrimmed)}`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (aiRes.ok) {
            aiData = await aiRes.json();
          }
        } catch (e) {
          console.warn('AI search service offline, using standard search results.');
        }

        // Defensively normalize search response
        const rawResults = (searchData && searchData.results) ? searchData.results : {};
        const safeResults = {
          users: Array.isArray(rawResults.users) ? rawResults.users : [],
          clubs: Array.isArray(rawResults.clubs) ? rawResults.clubs : [],
          posts: Array.isArray(rawResults.posts) ? rawResults.posts : [],
          events: Array.isArray(rawResults.events) ? rawResults.events : [],
          hackathons: Array.isArray(rawResults.hackathons) ? rawResults.hackathons : [],
          internships: Array.isArray(rawResults.internships) ? rawResults.internships : [],
          groups: Array.isArray(rawResults.groups) ? rawResults.groups : [],
          opportunities: Array.isArray(rawResults.opportunities) ? rawResults.opportunities : []
        };

        renderSearchResultsUI(qTrimmed, safeResults, aiData);
      } catch (err) {
        console.error('[SEARCH EXCEPTION]', err);
        showSearchErrorUI('Search is temporarily unavailable.', qTrimmed);
      }
    }

    function showSearchErrorUI(message, query) {
      const container = document.getElementById('search-dynamic-content');
      if (!container) return;
      container.innerHTML = `
        <div class="text-center py-10 card-bg rounded-2xl border border-red-500/30 p-6 shadow-xl">
          <div class="w-14 h-14 rounded-full bg-red-500/10 border border-red-500/40 text-red-400 flex items-center justify-center mx-auto mb-3 text-2xl">
            <i class="fa-solid fa-triangle-exclamation"></i>
          </div>

          <p class="text-xs text-gray-400 mb-4">Please check your network connection or backend status.</p>
          <button onclick="performGlobalSearch('${query}')" class="bg-[#00E5FF] text-black text-xs font-black px-5 py-2.5 rounded-xl uppercase tracking-wider shadow-lg hover:opacity-90">
            <i class="fa-solid fa-rotate-right mr-1"></i> Retry Search
          </button>
        </div>
      `;
    }

    let activePersonalChatUser = null;

    
    function cancelReplyPreview() {
      replyingToMessage = null;
      renderChatView();
    }

    function openMessageActionMenu(msgObj) {
      try {
        const m = (typeof msgObj === 'string') ? JSON.parse(msgObj) : msgObj;
        activeTargetMessageObj = m;
        
        const myId = currentUser?._id || currentUser?.id;
        const senderId = m.senderId?._id || m.senderId?.id || m.senderId;
        const isMe = senderId === myId;

        const existingModal = document.getElementById('chat-action-overlay');
        if (existingModal) existingModal.remove();

        const modal = document.createElement('div');
        modal.id = 'chat-action-overlay';
        modal.className = 'fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4';
        modal.onclick = closeChatActionOverlay;
        
        modal.innerHTML = `
          <div class="bg-[#181818] border border-[#202020] rounded-2xl p-4 w-full max-w-xs shadow-2xl" onclick="event.stopPropagation()">

              ${['👍', '❤️', '🔥', '🚀', '💡', '👏'].map(emoji => `
                <button onclick="reactToMessageAction('${m._id}', '${emoji}')" class="text-xl hover:scale-125 transition-transform p-1">${emoji}</button>
              `).join('')}
            </div>

            <!-- Message content preview -->
            <div class="bg-[#141414] p-2.5 rounded-xl border border-[#202020] text-xs text-gray-300 mb-3 truncate italic">
              "${(m.content || '').replace(/"/g, '&quot;')}"
            </div>

            <div class="space-y-1">
              <button onclick="startReplyToMessage()" class="w-full text-left p-2.5 rounded-xl hover:bg-[#202020] text-xs font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-reply text-[#2563EB]"></i> Reply
              </button>

              <button onclick="copyMessageText()" class="w-full text-left p-2.5 rounded-xl hover:bg-[#202020] text-xs font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-copy text-gray-400"></i> Copy Text
              </button>

              ${isMe ? `
                <button onclick="startEditMessage()" class="w-full text-left p-2.5 rounded-xl hover:bg-[#202020] text-xs font-bold text-amber-400 flex items-center gap-2">
                  <i class="fa-solid fa-pen-to-square"></i> Edit Message
                </button>
                <button onclick="startDeleteMessage()" class="w-full text-left p-2.5 rounded-xl hover:bg-red-500/10 text-xs font-bold text-red-400 flex items-center gap-2">
                  <i class="fa-solid fa-trash"></i> Delete Message
                </button>
              ` : `
                <button onclick="reportMessageAction()" class="w-full text-left p-2.5 rounded-xl hover:bg-red-500/10 text-xs font-bold text-red-400 flex items-center gap-2">
                  <i class="fa-solid fa-flag"></i> Report Message
                </button>
              `}
            </div>
          </div>
        `;

        document.body.appendChild(modal);
      } catch (e) {
        console.error('Error opening message action menu:', e);
      }

    function closeChatActionOverlay() {
      const modal = document.getElementById('chat-action-overlay');
      if (modal) modal.remove();
    }

    function startReplyToMessage() {
      if (!activeTargetMessageObj) return;
      replyingToMessage = activeTargetMessageObj;
      closeChatActionOverlay();
      renderChatView();
    }

    function copyMessageText() {
      if (!activeTargetMessageObj) return;
      closeChatActionOverlay();
      if (navigator.clipboard) {
        navigator.clipboard.writeText(activeTargetMessageObj.content || '');
      }
      alert('Message copied to clipboard');
    }

    async function reactToMessageAction(msgId, emoji) {
      closeChatActionOverlay();
      try {
        await fetch(`${API_BASE}/messages/${msgId}/react`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ emoji })
        });
        renderChatView();
      } catch (e) {
        console.error('Error reacting to message:', e);
      }
    }

    function startEditMessage() {
      if (!activeTargetMessageObj) return;
      const m = activeTargetMessageObj;
      closeChatActionOverlay();

      const existingModal = document.getElementById('edit-msg-modal');
      if (existingModal) existingModal.remove();

      const modal = document.createElement('div');
      modal.id = 'edit-msg-modal';
      modal.className = 'fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4';
      modal.innerHTML = `
        <div class="bg-[#181818] border border-[#202020] rounded-2xl p-5 w-full max-w-sm shadow-2xl">
          <h4 class="font-extrabold text-sm text-white mb-2 flex items-center gap-2">
            <i class="fa-solid fa-pen-to-square text-amber-400"></i> Edit Message
          </h4>
          <textarea id="edit-msg-input" class="w-full bg-[#141414] border border-[#202020] text-white text-xs rounded-xl p-3 outline-none focus:border-[#2563EB] mb-4 h-24">${(m.content || '').replace(/"/g, '&quot;')}</textarea>
          <div class="flex gap-2">
            <button onclick="document.getElementById('edit-msg-modal').remove()" class="flex-1 bg-[#141414] text-gray-400 font-bold py-2.5 rounded-xl text-xs border border-[#202020]">Cancel</button>
            <button onclick="submitEditMessage('${m._id}')" class="flex-1 bg-[#2563EB] text-white font-bold py-2.5 rounded-xl text-xs shadow-md">Save Changes</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    }

    async function submitEditMessage(msgId) {
      const input = document.getElementById('edit-msg-input');
      if (!input || !input.value.trim()) return;
      const newText = input.value.trim();
      const modal = document.getElementById('edit-msg-modal');
      if (modal) modal.remove();

      try {
        const res = await fetch(`${API_BASE}/messages/${msgId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ content: newText })
        });
        if (res.ok) {
          renderChatView();
        } else {
          const err = await res.json();
          alert(err.message || 'Failed to edit message.');
        }
      } catch (e) {
        console.error('Error updating message:', e);
      }
    }

    function startDeleteMessage() {
      if (!activeTargetMessageObj) return;
      const m = activeTargetMessageObj;
      closeChatActionOverlay();

      const existingModal = document.getElementById('delete-msg-modal');
      if (existingModal) existingModal.remove();

      const modal = document.createElement('div');
      modal.id = 'delete-msg-modal';
      modal.className = 'fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4';
      modal.innerHTML = `
        <div class="bg-[#181818] border border-[#202020] rounded-2xl p-5 w-full max-w-xs text-center shadow-2xl">
          <div class="w-12 h-12 rounded-full bg-red-500/10 border border-red-500/30 text-red-400 flex items-center justify-center mx-auto mb-3 text-xl">
            <i class="fa-solid fa-trash"></i>
          </div>
          <h4 class="font-extrabold text-sm text-white mb-1">Delete Message?</h4>
          <p class="text-xs text-gray-400 mb-4 leading-relaxed">This message will be deleted from the chat history.</p>
          <div class="flex gap-2">
            <button onclick="document.getElementById('delete-msg-modal').remove()" class="flex-1 bg-[#141414] text-gray-400 font-bold py-2.5 rounded-xl text-xs border border-[#202020]">Cancel</button>
            <button onclick="executeDeleteMessage('${m._id}')" class="flex-1 bg-red-500 text-white font-bold py-2.5 rounded-xl text-xs shadow-md">Delete</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    }

    async function executeDeleteMessage(msgId) {
      const modal = document.getElementById('delete-msg-modal');
      if (modal) modal.remove();

      try {
        const res = await fetch(`${API_BASE}/messages/${msgId}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
          renderChatView();
        } else {
          const err = await res.json();
          alert(err.message || 'Failed to delete message.');
        }
      } catch (e) {
        console.error('Error deleting message:', e);
      }
    }

    function reportMessageAction() {
      closeChatActionOverlay();
      alert('Thank you. Message reported to UNIRISE moderators.');
    }

    async function switchChatSubTab(subTab) {
      activeChatSubTab = subTab;
      activeGroupChatId = null;
      activePersonalChatUser = null;
      renderChatView();
    }

    
    function renderMessageBubble(m, currentUserId, defaultSenderName = 'Campus Student') {
      const myId = (typeof currentUserId === 'object' && currentUserId !== null) ? (currentUserId._id || currentUserId.id) : currentUserId;
      const senderObj = m.senderId || {};
      const senderId = senderObj._id || senderObj.id || senderObj;
      const isMe = senderId === myId;
      const timeStr = m.createdAt ? new Date(m.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
      const senderName = senderObj.name || defaultSenderName;
      
      const safeMsgJson = JSON.stringify(m).replace(/'/g, "&#39;").replace(/"/g, "&quot;");

      let replyHtml = '';
      if (m.replyTo) {
        const replySender = m.replyTo.senderId?.name || 'Replied Message';
        const replyText = m.replyTo.content || 'Message';
        replyHtml = `
          <div class="bg-[#141414] border-l-2 border-[#2563EB] px-2.5 py-1 rounded-md mb-1.5 text-left">
            <span class="text-[10px] font-bold text-[#2563EB] block">${replySender}</span>
            <p class="text-[11px] text-gray-300 line-clamp-1">${replyText}</p>
          </div>
        `;
      }

      let reactionsHtml = '';
      if (m.reactions && m.reactions.length > 0) {
        const uniqueEmojis = Array.from(new Set(m.reactions.map(r => r.emoji))).slice(0, 3);
        reactionsHtml = `
          <div class="flex items-center gap-1 mt-1 bg-[#141414] border border-[#202020] px-2 py-0.5 rounded-full w-fit">
            ${uniqueEmojis.map(e => `<span>${e}</span>`).join('')}
            <span class="text-[9px] text-gray-400 font-bold">${m.reactions.length}</span>
          </div>
        `;
      }

      let contentHtml = '';
      if (m.isDeleted) {
        contentHtml = `
          <div class="text-xs text-gray-400 italic flex items-center gap-1.5 py-0.5">
            <i class="fa-solid fa-ban text-[10px]"></i> This message was deleted
          </div>
        `;
      } else {
        contentHtml = `
          <div class="text-xs text-white leading-relaxed">
            ${m.content || ''}
            ${m.isEdited ? '<span class="text-[9px] text-gray-400 italic ml-1">(edited)</span>' : ''}
          </div>
        `;
      }

      return `
        <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'} mb-2">
          <div onclick="openMessageActionMenu(${safeMsgJson})" oncontextmenu="event.preventDefault(); openMessageActionMenu(${safeMsgJson})" class="card-bg p-3 rounded-2xl border ${isMe ? 'border-[#2563EB]/60 bg-[#2563EB]/10' : 'border-[#202020]'} max-w-[280px] cursor-pointer hover:border-[#2563EB] transition-all relative">
            ${!isMe ? `<div class="text-[11px] font-bold text-[#2563EB] mb-0.5">${senderName}</div>` : ''}
            ${replyHtml}
            ${contentHtml}
            ${reactionsHtml}
          </div>
          ${timeStr ? `<span class="text-[9px] text-gray-500 mt-0.5 ${isMe ? 'pr-2' : 'pl-2'}">${timeStr}</span>` : ''}
        </div>
      `;
    }

    function renderReplyPreviewBar() {
      if (!replyingToMessage) return '';
      const sender = replyingToMessage.senderId?.name || 'Campus Student';
      const text = replyingToMessage.content || 'Message';
      return `
        <div id="reply-preview-container" class="bg-[#141414] border-t border-l border-r border-[#2563EB] px-3 py-2 rounded-t-xl flex items-center justify-between text-left">

      const input = document.getElementById('chat-msg-input');
      if (!input || !input.value.trim()) return;
      const text = input.value.trim();
      const replyId = replyingToMessage ? replyingToMessage._id : null;
      input.value = '';
      replyingToMessage = null;

      try {
        await fetch(`${API_BASE}/messages`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ content: text, groupId: groupId, replyTo: replyId })

      if (!userOrPosition) {

        return;
      }
      let targetId = null;
      if (typeof userOrPosition === 'string') {
        targetId = userOrPosition;
      } else if (typeof userOrPosition === 'object') {
        if (userOrPosition.userId) {
          if (typeof userOrPosition.userId === 'string') {
            targetId = userOrPosition.userId;
          } else if (userOrPosition.userId._id || userOrPosition.userId.id) {
            targetId = userOrPosition.userId._id || userOrPosition.userId.id;
          }
        }
        if (!targetId && (userOrPosition._id || userOrPosition.id)) {
          targetId = userOrPosition._id || userOrPosition.id;
        }
      }

      if (!targetId) {
        console.error('[Navigation] Could not resolve user ID from:', userOrPosition);

        return;
      }

      console.log(`[Navigation] Selected User ID (${targetId}) != Current User ID (${currentUser?._id})`);
      viewUserProfile(targetId);

    async function submitNewPost() {
      const content = document.getElementById('new-post-content')?.value?.trim();
      const title = document.getElementById('new-post-title')?.value?.trim();
      const category = document.getElementById('new-post-category')?.value;
      const mediaStr = document.getElementById('new-post-media')?.value?.trim();
      const hashtagsStr = document.getElementById('new-post-hashtags')?.value?.trim();

      if (!content) {
        alert('Please enter post content.');
        return;
      }

      const btn = document.getElementById('submit-post-btn');
      if (btn) btn.disabled = true;

      const media = mediaStr ? [mediaStr] : [];
      const hashtags = hashtagsStr ? hashtagsStr.split(',').map(h => h.trim().startsWith('#') ? h.trim() : `#${h.trim()}`) : [];

      try {
        const res = await fetch(`${API_BASE}/posts`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            content,
            title,
            category,
            media,
            hashtags
          })
        });

        if (res.ok) {
          document.getElementById('create-post-modal')?.remove();
          switchTab('feed');
          renderFeedView();
        } else {
          const data = await res.json();
          alert(`Failed to create post: ${data.message || 'Server error'}`);
          if (btn) btn.disabled = false;
        }
      } catch (e) {
        console.error('Error publishing post:', e);
        alert('Failed to connect to server.');
        if (btn) btn.disabled = false;
      }
    }

    function handleImageFileSelect(inputEl, targetInputId) {
      if (inputEl.files && inputEl.files[0]) {
        const file = inputEl.files[0];
        if (file.size > 5 * 1024 * 1024) {
          alert('Selected image exceeds 5MB limit. Please choose a smaller image.');
          return;
        }
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById(targetInputId).value = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

      const existing = document.getElementById('unirise-toast-alert');

    function initSocketNotifications() {
      if (typeof io !== 'undefined' && currentUser) {
        if (!socket) {
          socket = io();
        }
        const uid = currentUser._id || currentUser.id;
        socket.emit('registerUser', uid);

        socket.off('notification:new');
        socket.on('notification:new', (notif) => {
          fetchUnreadCount();
          showToastNotification(notif);
        });

        socket.off('notification:unreadCount');
        socket.on('notification:unreadCount', (data) => {
          updateHeaderUnreadBadge(data.unreadCount || 0);
        });
      }
    }

        const res = await fetch(`${API_BASE}/notifications`, { headers: { 'Authorization': `Bearer ${token}` } });
        if (!res.ok) {
          main.innerHTML = `<div class="text-red-400 text-center py-10">Failed to load notifications.</div>`;
          return;
        }

        const data = await res.json();
        const notifications = data.notifications || [];
        const unreadCount = data.unreadCount || 0;

        updateHeaderUnreadBadge(unreadCount);

        let filtered = notifications;
        if (activeNotificationFilter === 'Clubs') {
          filtered = notifications.filter(n => n.type && n.type.startsWith('CLUB'));
        } else if (activeNotificationFilter === 'Chats') {
          filtered = notifications.filter(n => n.type === 'PERSONAL_CHAT');
        } else if (activeNotificationFilter === 'Groups') {
          filtered = notifications.filter(n => n.type === 'GROUP_CHAT');
        } else if (activeNotificationFilter === 'Community') {
          filtered = notifications.filter(n => n.type === 'COMMUNITY' || n.type === 'REPLY' || n.type === 'MENTION');
        } else if (activeNotificationFilter === 'AI Alerts') {
          filtered = notifications.filter(n => n.type === 'AI_SEARCH_ALERT');
        }

        const filters = ['All', 'Clubs', 'Chats', 'Groups', 'Community', 'AI Alerts'];

        main.innerHTML = `

            </div>

                ${f === 'AI Alerts' ? '🤖 AI Alerts' : f}
              </button>
            `).join('')}
          </div>

          <!-- LIST -->
          <div class="space-y-3">
            ${filtered.length > 0 ? filtered.map(n => {
              const isUnread = !n.isRead;
              let iconClass = "fa-solid fa-bell text-[#2563EB]";

                badgeBg = "bg-[#1D9BF0]/10 border-[#1D9BF0]/30 text-[#1D9BF0]";
                badgeLabel = "CLUB UPDATE";
              } else if (n.type === 'PERSONAL_CHAT') {

                badgeBg = "bg-emerald-500/10 border-emerald-500/30 text-emerald-400";

    async function handleNotificationClick(id, type, entityType, entityId, clubId, senderId, groupId) {
      try {
        await fetch(`${API_BASE}/notifications/${id}/read`, {
          method: 'PATCH',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        fetchUnreadCount();
      } catch (e) {}

      if (type === 'AI_SEARCH_ALERT' || entityType === 'post') {
        if (entityId) renderPostDetailView(entityId);
        else switchTab('feed');
      } else if (type && type.startsWith('CLUB')) {
        if (entityType === 'post' && entityId) renderPostDetailView(entityId);
        else if (clubId) viewClubDetail(clubId);
        else if (entityId) viewClubDetail(entityId);
        else switchTab('clubs');
      } else if (type === 'PERSONAL_CHAT') {
        if (senderId || entityId) openDirectChatFromProfile(senderId || entityId, 'User');
        else switchTab('chat');
      } else if (type === 'GROUP_CHAT') {
        if (groupId || entityId) {
          activeChatSubTab = 'groups';
          activeGroupChatId = groupId || entityId;
          switchTab('chat');
        } else {
          switchTab('chat');
        }
      } else if (type === 'CONNECTION_ACCEPTED' || type === 'CONNECTION_REQUEST') {
        if (entityId) viewUserProfile(entityId);
        else switchTab('profile');
      } else {
        switchTab('feed');
      }
    }

          }
        } else {
          if (container) {
            container.innerHTML = `<div class="text-xs text-red-400">Failed to create alert. Please try again.</div>`;
          }
        }
      } catch (e) {
        console.error('Create search alert error:', e);
      }
    }

    async function openManageSearchAlertsModal() {
      closeProfileModal();
      const modal = document.createElement('div');
      modal.id = 'profile-modal-overlay';
      modal.className = 'fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4';
      
      modal.innerHTML = `
        <div class="card-bg w-full max-w-md rounded-2xl border border-[#202020] p-5 shadow-2xl relative max-h-[85vh] overflow-y-auto">
          <div class="flex items-center justify-between border-b border-[#202020] pb-3 mb-4">
            <h3 class="font-extrabold text-sm text-white flex items-center gap-2">
              <i class="fa-solid fa-robot text-amber-400"></i> My AI Search Alerts
            </h3>
            <button onclick="closeProfileModal()" class="text-gray-400 hover:text-white text-base font-bold">&times;</button>
          </div>

          <div id="alerts-modal-content" class="space-y-3">
            <div class="text-xs text-gray-400 text-center py-4"><i class="fa-solid fa-circle-notch fa-spin text-[#2563EB]"></i> Loading alerts...</div>
          </div>
        </div>
      `;
      document.body.appendChild(modal);

      try {
        const res = await fetch(`${API_BASE}/search/alerts`, { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        const alerts = data.alerts || [];

        const container = document.getElementById('alerts-modal-content');
        if (container) {
          container.innerHTML = alerts.length > 0 ? alerts.map(a => `
            <div class="bg-[#181818] p-3.5 rounded-xl border border-[#202020] flex items-center justify-between">
              <div>
                <div class="flex items-center gap-2 mb-1">
                  <span class="text-[9px] font-extrabold uppercase px-2 py-0.5 rounded-md ${a.status === 'active' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40' : (a.status === 'fulfilled' ? 'bg-[#2563EB]/20 text-[#2563EB] border border-[#2563EB]/40' : 'bg-gray-500/20 text-gray-400 border border-gray-500/40')}">
                    ${a.status}
                  </span>
                  <span class="text-[10px] text-gray-500">${new Date(a.createdAt).toLocaleDateString()}</span>
                </div>
                <h4 class="font-bold text-xs text-white">"${a.originalQuery}"</h4>
              </div>

              <div class="flex items-center gap-1.5">
                ${a.status === 'active' ? `
                  <button onclick="toggleSearchAlertStatus('${a._id}', 'paused')" class="bg-amber-500/10 text-amber-400 border border-amber-500/30 text-[10px] font-bold px-2 py-1 rounded-lg">Pause</button>
                ` : (a.status === 'paused' ? `
                  <button onclick="toggleSearchAlertStatus('${a._id}', 'active')" class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 text-[10px] font-bold px-2 py-1 rounded-lg">Resume</button>
                ` : '')}
                <button onclick="deleteSearchAlertItem('${a._id}')" class="text-gray-500 hover:text-red-400 text-xs p-1">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            </div>
          `).join('') : '<div class="text-xs text-gray-500 py-6 text-center">No active search alerts found. Tap "Notify me" on any empty search to create one!</div>';
        }
      } catch (e) {
        console.error('Failed to load search alerts:', e);
      }
    }

    async function toggleSearchAlertStatus(id, newStatus) {
      try {
        await fetch(`${API_BASE}/search/alerts/${id}/status`, {
          method: 'PATCH',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ status: newStatus })
        });
        openManageSearchAlertsModal();
      } catch (e) {}
    }

    async function deleteSearchAlertItem(id) {
      try {
        await fetch(`${API_BASE}/search/alerts/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        openManageSearchAlertsModal();
      } catch (e) {}
    }

    async function initSession() {
      if (token) {
        try {
          const res = await fetch(`${API_BASE}/auth/me`, { headers: { 'Authorization': `Bearer ${token}` } });
          if (res.ok) {
            currentUser = await res.json();
            initSocketNotifications();
            fetchUnreadCount();
            if (currentUser.role === 'admin') {
              switchTab('admin');
            } else {
              switchTab('feed');
            }
            return;
          }
        } catch (e) {}
      }
      renderLoginView();
    }

    initSession();
  </script>
</body>
</html>
